name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, config snippets, browser, Agentgram version.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.13.0 or commit SHA
